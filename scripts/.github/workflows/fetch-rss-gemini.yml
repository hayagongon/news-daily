name: Fetch RSS News (Gemini Test)

on:
  workflow_dispatch: # ボタンを押して手動でテスト実行できるようにする設定

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch RSS feeds & Gemini AI filtering
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-rss-gemini.js

      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss-articles.json ai-excluded-ids.json
          git diff --staged --quiet \
            || git commit -m "📰 Gemini テスト実行によるニュース更新"
          git push
